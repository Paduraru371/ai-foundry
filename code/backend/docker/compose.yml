name: backend

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag-qdrant

    ports:
      - "7833:6333" # HTTP + dashboard: http://localhost:7833/dashboard
      - "7834:6334" # gRPC

    volumes:
      - qdrant-data:/qdrant/storage

  api:
    build:
      context: ../../..
      dockerfile: code/backend/docker/backend.Dockerfile
    container_name: rag-api

    ports:
      - "7799:7799"
    
    env_file:
      - ../../../.env

    environment:
      # inside the compose network the DB is a hostname, not a mapped port
      QDRANT_URL: http://qdrant:6333
      # uncomment to reach LM Studio running on the HOST from inside the container:
      # LMSTUDIO_BASE_URL: http://host.docker.internal:1234/v1
    
    volumes:
      # live reload: edit locally, uvicorn restarts in-container
      - ../app:/srv/app

    depends_on:
      - qdrant

    extra_hosts:
      - "host.docker.internal:host-gateway" # makes host LM Studio reachable on Linux too

volumes:
  qdrant-data:
